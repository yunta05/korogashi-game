<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<style>html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>ころがし箱庭</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one screen. Thin HUD on top, a tall scrolling tray fills the rest, overlays sit on the tray. Single committed look (a lacquered night-blue tray). */
:root{
  color-scheme: dark;
  --night:#14213a;      /* page ground */
  --tray:#1f3a5f;       /* board floor */
  --wall:#f2c14e;       /* walls, primary accent */
  --wall-shade:#b9862a;
  --ball:#7fe0c3;       /* the roller */
  --goal:#ff6f91;
  --ink:#f4f1e6;        /* text */
  --ink-soft:#a9b8d0;
  --font: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}
html,body{height:100%}
body{
  background:var(--night); color:var(--ink); font-family:var(--font);
  display:flex; flex-direction:column; overflow:hidden;
  padding-inline:16px; padding-block:10px 12px; box-sizing:border-box;
  -webkit-user-select:none; user-select:none; overscroll-behavior:none;
}
.hud{display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding-bottom:8px; flex-wrap:wrap}
.hud h1{font-size:16px; font-weight:900; margin:0; letter-spacing:.04em}
.stats{display:flex; gap:12px; font-size:13px; font-weight:700; color:var(--ink-soft); font-variant-numeric:tabular-nums}
.stats b{color:var(--ink); font-weight:900; font-size:16px}
.stats b.low{color:var(--goal)}
.stage{position:relative; flex:1; min-height:0; overflow:hidden; border-radius:18px}
canvas{position:absolute; top:0; left:50%; transform:translateX(-50%); display:block; touch-action:none; border-radius:18px}
.mode{font-size:12px; font-weight:700; color:var(--ink-soft); text-align:center; padding-top:6px; min-height:1.4em}
.panel{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; text-align:center; padding:20px; background:rgba(20,33,58,.88); border-radius:18px;
}
.panel h2{font-size:28px; font-weight:900; margin:0; text-wrap:balance; color:var(--wall)}
.panel p{margin:0; font-size:15px; line-height:1.7; max-width:22em; color:var(--ink)}
.panel .small{font-size:13px; color:var(--ink-soft)}
button{
  font:inherit; font-weight:900; font-size:18px; color:var(--night); background:var(--wall);
  border:0; border-radius:999px; padding:14px 34px; box-shadow:0 5px 0 var(--wall-shade); cursor:pointer;
}
button:active{transform:translateY(3px); box-shadow:0 2px 0 var(--wall-shade)}
button:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
</style>

</head>
<body>
<div class="hud">
  <h1 id="title">ころがし箱庭</h1>
  <div class="stats"><span>のこり <b id="time">60</b></span><span>ほし <b id="stars">0</b></span><span>赤ほし <b id="reds">0/3</b></span></div>
</div>
<div class="stage" id="stage">
  <canvas id="cv"></canvas>
  <div class="panel" id="panel">
    <h2 id="pTitle">ゴールの穴へ</h2>
    <p id="pText">スマホを傾けて玉を転がし、時間内にピンクの穴へ。画面をタップするか、スマホをポンとはね上げるとジャンプして、穴やみぞを飛びこえられます。</p>
    <button id="pBtn" type="button">あそぶ</button>
    <p class="small" id="pSmall">いま持っている角度が「水平」になります。<br>傾きが使えないときは、指でなぞって傾け、軽くタップでジャンプ。</p>
  </div>
</div>
<div class="mode" id="mode"></div>

<script>
(function(){
  const W=360,R=11,PR=14,JT=0.5;
  const LV=[
   {name:'はじめの坂',h:1100,time:60,start:[180,50],goal:[180,1020],
    walls:[[0,150,230,12],[130,280,230,12],[0,540,140,12],[220,540,140,12],[60,680,300,12],[0,830,90,12],[230,830,130,12]],
    pits:[[200,215],[180,610],[260,645],[100,960],[260,960]],
    trench:[[0,400,360,24],[230,692,24,138]],
    bump:[[180,480,16]],conv:[],
    stars:[[295,156],[60,230],[80,470],[280,470],[120,640],[180,900],[60,1040],[300,1040]],
    red:[310,760],clocks:[[320,615]],cps:[[65,335],[30,735]],
    hints:[[180,368,'タップ か はね上げ で ジャンプ']]},
   {name:'ながれる床',h:1400,time:80,start:[50,50],goal:[180,1300],
    walls:[[0,140,250,12],[110,280,250,12],[0,600,150,12],[210,600,150,12],[0,760,280,12],[80,920,280,12],[0,1080,130,12],[230,1080,130,12]],
    pits:[[30,650],[30,725],[110,870],[300,1040],[50,1050],[70,1300],[290,1300]],
    trench:[[0,380,360,24],[0,470,360,24],[150,810,100,22],[150,888,100,22],[150,832,22,56],[228,832,22,56]],
    bump:[[100,545,15],[260,545,15],[180,515,15],[110,1215,15],[250,1215,15]],
    conv:[[120,165,170,100,480,0],[70,630,200,110,-460,0],[130,1000,100,150,0,-480]],
    stars:[[300,146],[200,215],[320,700],[180,1040],[180,1120],[180,1215],[40,330],[320,330]],
    red:[200,860],clocks:[[180,437]],cps:[[50,240],[320,800]],
    hints:[[205,158,'ながれる床']]},
   {name:'はねる小部屋',h:1500,time:100,start:[180,50],goal:[180,1400],
    walls:[[0,340,150,12],[210,340,150,12],[70,680,290,12],[0,840,290,12],[0,1000,150,12],[210,1000,150,12],[60,1250,240,12]],
    pits:[[130,285],[230,285],[120,735],[120,805],[200,770],[270,740],[120,1400],[240,1400],[180,1340]],
    trench:[[0,430,360,24],[0,500,360,24],[0,570,360,24],[100,852,24,148],[0,1110,360,24]],
    bump:[[90,150,15],[270,150,15],[180,215,15],[60,265,15],[300,265,15],[300,930,16],[180,1190,16]],
    conv:[[80,605,280,65,450,0],[0,1030,360,70,0,300]],
    stars:[[180,130],[180,300],[300,547],[160,770],[180,930],[180,1455],[60,1330],[300,1330]],
    red:[50,925],clocks:[[60,477],[30,1210]],cps:[[180,380],[35,725],[180,1006]],
    hints:[]}
  ];

  const cv=document.getElementById('cv'), ctx=cv.getContext('2d'), stage=document.getElementById('stage');
  const $=id=>document.getElementById(id);
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  let scale=1,viewH=560,cam=0;
  let cur=0,L=LV[0],ball,stars,clocks,red,cp,timeLeft=0,falling=null,playing=false,last=0;
  let totalStars=0,totalReds=0,stageStars=0,bumpFlash=[],action='start';
  let sensor={x:0,y:0,ok:false,beta0:null}, touch={x:0,y:0,on:false,ox:0,oy:0,t:0,moved:0}, keys={};

  function fit(){
    const r=stage.getBoundingClientRect(); if(!r.width||!r.height) return;
    scale=r.width/W; if(r.height/scale<420) scale=r.height/420;
    viewH=r.height/scale;
    const dpr=Math.min(window.devicePixelRatio||1,3);
    cv.style.width=W*scale+'px'; cv.style.height=r.height+'px';
    cv.width=Math.round(W*scale*dpr); cv.height=Math.round(r.height*dpr);
    ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
    draw(0);
  }
  function load(i){
    cur=i; L=LV[i];
    ball={x:L.start[0],y:L.start[1],vx:0,vy:0,s:1,j:0,cool:0};
    stars=L.stars.map(s=>({x:s[0],y:s[1],got:false}));
    clocks=L.clocks.map(s=>({x:s[0],y:s[1],got:false}));
    red={x:L.red[0],y:L.red[1],got:false};
    cp={x:L.start[0],y:L.start[1],i:-1};
    bumpFlash=L.bump.map(()=>0);
    timeLeft=L.time; falling=null; stageStars=0; sensor.beta0=null; cam=0;
    $('title').textContent='ステージ'+(i+1)+'　'+L.name;
    hud();
  }
  function hud(){
    const t=$('time'); t.textContent=Math.ceil(timeLeft); t.classList.toggle('low',timeLeft<10);
    $('stars').textContent=totalStars+stageStars;
    $('reds').textContent=(totalReds+(red&&red.got?1:0))+'/3';
  }

  function onOrient(e){
    if(e.gamma==null||e.beta==null) return;
    sensor.ok=true;
    if(sensor.beta0==null) sensor.beta0=clamp(e.beta,-20,70);
    sensor.x=clamp(e.gamma/28,-1,1);
    sensor.y=clamp((e.beta-sensor.beta0)/28,-1,1);
  }
  function onMotion(e){
    const a=e.acceleration; if(!a||a.z==null) return;
    if(Math.abs(a.z)>8) jump();
  }
  function jump(){
    if(!playing||falling||ball.j>0||ball.cool>0) return;
    ball.j=JT;
  }
  function tilt(){
    if(touch.on) return touch;
    const kx=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0), ky=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0);
    if(kx||ky) return {x:kx,y:ky};
    if(sensor.ok) return sensor;
    return {x:0,y:0};
  }
  const inRect=(r)=>ball.x>r[0]&&ball.x<r[0]+r[2]&&ball.y>r[1]&&ball.y<r[1]+r[3];

  function collideRect(x,y,w,h){
    const nx=clamp(ball.x,x,x+w), ny=clamp(ball.y,y,y+h);
    let dx=ball.x-nx, dy=ball.y-ny, d=Math.hypot(dx,dy);
    if(d>=R) return;
    if(d<1e-6){dx=0;dy=-1;d=1;}
    dx/=d; dy/=d;
    ball.x=nx+dx*R; ball.y=ny+dy*R;
    const vn=ball.vx*dx+ball.vy*dy;
    if(vn<0){ball.vx-=1.35*vn*dx; ball.vy-=1.35*vn*dy;}
  }
  function step(dt){
    const t=tilt(), air=ball.j>0;
    ball.vx+=t.x*950*dt; ball.vy+=t.y*950*dt;
    if(!air) for(const c of L.conv) if(inRect(c)){ball.vx+=c[4]*dt; ball.vy+=c[5]*dt;}
    const f=Math.exp(-1.3*dt); ball.vx*=f; ball.vy*=f;
    ball.x+=ball.vx*dt; ball.y+=ball.vy*dt;
    if(ball.x<R){ball.x=R; if(ball.vx<0)ball.vx*=-0.35;}
    if(ball.x>W-R){ball.x=W-R; if(ball.vx>0)ball.vx*=-0.35;}
    if(ball.y<R){ball.y=R; if(ball.vy<0)ball.vy*=-0.35;}
    if(ball.y>L.h-R){ball.y=L.h-R; if(ball.vy>0)ball.vy*=-0.35;}
    for(const w of L.walls) collideRect(w[0],w[1],w[2],w[3]);
    L.bump.forEach((b,i)=>{
      let dx=ball.x-b[0],dy=ball.y-b[1],d=Math.hypot(dx,dy),m=R+b[2];
      if(d>=m) return; if(d<1e-6){dx=0;dy=1;d=1;}
      dx/=d;dy/=d; ball.x=b[0]+dx*m; ball.y=b[1]+dy*m;
      const vn=ball.vx*dx+ball.vy*dy; ball.vx-=vn*dx; ball.vy-=vn*dy;
      const out=Math.max(340,-vn*1.1); ball.vx+=dx*out; ball.vy+=dy*out; bumpFlash[i]=0.2;
    });
    for(const s of stars) if(!s.got&&Math.hypot(ball.x-s.x,ball.y-s.y)<R+9){s.got=true;stageStars++;}
    for(const c of clocks) if(!c.got&&Math.hypot(ball.x-c.x,ball.y-c.y)<R+10){c.got=true;timeLeft+=10;}
    if(!red.got&&Math.hypot(ball.x-red.x,ball.y-red.y)<R+12) red.got=true;
    L.cps.forEach((c,i)=>{if(cp.i!==i&&Math.hypot(ball.x-c[0],ball.y-c[1])<R+14) cp={x:c[0],y:c[1],i:i};});
    if(air) return;
    for(const p of L.pits) if(Math.hypot(ball.x-p[0],ball.y-p[1])<PR-2){falling={x:p[0],y:p[1],t:0,goal:false};return;}
    for(const r of L.trench) if(inRect(r)){falling={x:ball.x,y:ball.y,t:0,goal:false};return;}
    if(Math.hypot(ball.x-L.goal[0],ball.y-L.goal[1])<13) falling={x:L.goal[0],y:L.goal[1],t:0,goal:true};
  }
  function frame(now){
    const dt=Math.min(0.033,(now-last)/1000||0); last=now;
    if(playing){
      timeLeft-=dt;
      for(let i=0;i<bumpFlash.length;i++) if(bumpFlash[i]>0) bumpFlash[i]-=dt;
      if(falling){
        falling.t+=dt; const k=Math.min(1,falling.t/0.4);
        ball.x+=(falling.x-ball.x)*0.25; ball.y+=(falling.y-ball.y)*0.25; ball.s=1-k;
        if(k>=1){
          if(falling.goal){playing=false; clearStage();}
          else{ball.x=cp.x;ball.y=cp.y;ball.vx=ball.vy=0;ball.s=1;ball.j=0;falling=null;timeLeft-=3;}
        }
      }else{
        if(ball.j>0){ball.j-=dt; if(ball.j<=0){ball.j=0;ball.cool=0.12;}}
        else if(ball.cool>0) ball.cool-=dt;
        for(let i=0;i<4;i++){ if(falling)break; step(dt/4); }
      }
      if(playing&&timeLeft<=0){timeLeft=0;playing=false;timeUp();}
      const max=Math.max(0,L.h-viewH);
      const ty=L.h<viewH?-(viewH-L.h)/2:clamp(ball.y-viewH*0.45+clamp(ball.vy*0.18,-60,60),0,max);
      cam+=(ty-cam)*Math.min(1,dt*6);
      hud();
      $('mode').textContent=sensor.ok?'傾けて転がす ・ タップ／はね上げでジャンプ':'指でなぞって傾ける ・ 軽くタップでジャンプ';
    }
    draw(now);
    requestAnimationFrame(frame);
  }
  function show(title,text,btn,small,act){
    $('pTitle').textContent=title; $('pText').textContent=text; $('pBtn').textContent=btn;
    $('pSmall').textContent=small||''; $('pSmall').hidden=!small; action=act; $('panel').hidden=false; $('mode').textContent='';
  }
  function clearStage(){
    totalStars+=stageStars; if(red.got) totalReds++;
    const line='のこり '+Math.ceil(timeLeft)+' 秒　ほし '+stageStars+'/'+L.stars.length+'　赤ほし '+(red.got?'ゲット':'なし');
    stageStars=0; red.got=false; hud();
    if(cur<LV.length-1) show('ステージ'+(cur+1)+' クリア！',line,'つぎのステージ','','next');
    else show('ぜんぶクリア！',line+'　／　合計 ほし '+totalStars+'・赤ほし '+totalReds+'/3','さいしょから',totalReds<3?'赤ほしは、みぞの向こうに隠れています。':'赤ほしコンプリート！','restart');
  }
  function timeUp(){ show('タイムアップ','穴に落ちると3秒へります。時計を取ると10秒ふえます。','もういちど','','retry'); }

  function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
  function star(x,y,r,rot,col){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle=col;ctx.beginPath();
    for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,q=i%2?r*0.45:r;ctx.lineTo(Math.cos(a)*q,Math.sin(a)*q);}ctx.closePath();ctx.fill();ctx.restore();}
  function draw(now){
    now=now||0;
    ctx.fillStyle='#14213a';ctx.fillRect(0,0,W,viewH);
    ctx.save();ctx.translate(0,-cam);
    const g=ctx.createLinearGradient(0,0,W,L.h);g.addColorStop(0,'#2b4f7c');g.addColorStop(1,'#1f3a5f');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,L.h);
    ctx.fillStyle='rgba(255,255,255,.035)';
    const y0=Math.max(20,Math.floor(cam/40)*40+20);
    for(let y=y0;y<Math.min(L.h,cam+viewH+40);y+=40)for(let x=20;x<W;x+=40){ctx.beginPath();ctx.arc(x,y,2,0,7);ctx.fill();}
    // conveyors
    for(const c of L.conv){
      ctx.fillStyle='rgba(127,224,195,.13)';rr(c[0],c[1],c[2],c[3],8);ctx.fill();
      ctx.save();rr(c[0],c[1],c[2],c[3],8);ctx.clip();
      const ang=Math.atan2(c[5],c[4]),off=(now/12)%28;
      ctx.translate(c[0]+c[2]/2,c[1]+c[3]/2);ctx.rotate(ang);
      ctx.strokeStyle='rgba(127,224,195,.5)';ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';
      for(let x=-240+off;x<240;x+=28)for(let y=-220;y<=220;y+=30){ctx.beginPath();ctx.moveTo(x-5,y-7);ctx.lineTo(x+3,y);ctx.lineTo(x-5,y+7);ctx.stroke();}
      ctx.restore();
    }
    // hints
    ctx.fillStyle='rgba(244,241,230,.55)';ctx.font='700 13px "Zen Maru Gothic","Hiragino Sans",sans-serif';ctx.textAlign='center';
    for(const h of L.hints) ctx.fillText(h[2],h[0],h[1]);
    // start mark, checkpoints
    ctx.setLineDash([4,5]);ctx.lineWidth=2;ctx.strokeStyle='rgba(244,241,230,.35)';ctx.beginPath();ctx.arc(L.start[0],L.start[1],17,0,7);ctx.stroke();ctx.setLineDash([]);
    L.cps.forEach((c,i)=>{const on=cp&&cp.i===i;
      ctx.strokeStyle=on?'#7fe0c3':'rgba(244,241,230,.4)';ctx.lineWidth=on?3:2;ctx.beginPath();ctx.arc(c[0],c[1],15,0,7);ctx.stroke();
      ctx.fillStyle=on?'#7fe0c3':'rgba(244,241,230,.4)';ctx.beginPath();ctx.moveTo(c[0]-3,c[1]-8);ctx.lineTo(c[0]+7,c[1]-4);ctx.lineTo(c[0]-3,c[1]);ctx.closePath();ctx.fill();
      ctx.fillRect(c[0]-4,c[1]-8,2,16);});
    // trenches and pits
    for(const r of L.trench){ctx.fillStyle='#070d1a';rr(r[0],r[1],r[2],r[3],5);ctx.fill();ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(r[0],r[1],r[2],3);}
    for(const p of L.pits){
      const pg=ctx.createRadialGradient(p[0],p[1]+2,2,p[0],p[1],PR);pg.addColorStop(0,'#000');pg.addColorStop(1,'#0a1222');
      ctx.fillStyle=pg;ctx.beginPath();ctx.arc(p[0],p[1],PR,0,7);ctx.fill();
    }
    // goal
    const gx=L.goal[0],gy=L.goal[1],pulse=1+0.08*Math.sin(now/300);
    ctx.fillStyle='rgba(255,111,145,.25)';ctx.beginPath();ctx.arc(gx,gy,25*pulse,0,7);ctx.fill();
    ctx.fillStyle='#ff6f91';ctx.beginPath();ctx.arc(gx,gy,17,0,7);ctx.fill();
    ctx.fillStyle='#7a1f3a';ctx.beginPath();ctx.arc(gx,gy+1,12,0,7);ctx.fill();
    // pickups
    if(stars) for(const s of stars) if(!s.got) star(s.x,s.y,9,now/900,'#fff3b0');
    if(red&&!red.got){ctx.fillStyle='rgba(255,90,90,.25)';ctx.beginPath();ctx.arc(red.x,red.y,17*pulse,0,7);ctx.fill();star(red.x,red.y,12,-now/700,'#ff5a5a');}
    if(clocks) for(const c of clocks) if(!c.got){
      ctx.fillStyle='#f4f1e6';ctx.beginPath();ctx.arc(c.x,c.y,10,0,7);ctx.fill();
      ctx.strokeStyle='#14213a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(c.x,c.y-6);ctx.lineTo(c.x,c.y);ctx.lineTo(c.x+4,c.y+2);ctx.stroke();}
    // walls
    for(const w of L.walls){
      ctx.fillStyle='#b9862a';rr(w[0],w[1]+3,w[2],w[3],6);ctx.fill();
      ctx.fillStyle='#f2c14e';rr(w[0],w[1],w[2],w[3],6);ctx.fill();
    }
    // bumpers
    L.bump.forEach((b,i)=>{const fl=bumpFlash[i]>0, r=b[2]+(fl?3:0);
      ctx.fillStyle='#a8405a';ctx.beginPath();ctx.arc(b[0],b[1]+3,r,0,7);ctx.fill();
      ctx.fillStyle=fl?'#ffd0dc':'#ff6f91';ctx.beginPath();ctx.arc(b[0],b[1],r,0,7);ctx.fill();
      ctx.strokeStyle='#f4f1e6';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(b[0],b[1],r-5,0,7);ctx.stroke();});
    // ball
    if(ball&&ball.s>0.02){
      const hgt=ball.j>0?Math.sin(Math.PI*(1-ball.j/JT)):0;
      const r=R*ball.s*(1+0.35*hgt), bx=ball.x, by=ball.y-hgt*14;
      ctx.fillStyle='rgba(0,0,0,'+(0.28-0.12*hgt)+')';ctx.beginPath();ctx.ellipse(ball.x+2+hgt*5,ball.y+4+hgt*6,R*ball.s,R*ball.s*.9,0,0,7);ctx.fill();
      const bg=ctx.createRadialGradient(bx-r*.4,by-r*.4,1,bx,by,r);bg.addColorStop(0,'#d8fff2');bg.addColorStop(1,'#7fe0c3');
      ctx.fillStyle=bg;ctx.beginPath();ctx.arc(bx,by,r,0,7);ctx.fill();
      const k=r/R, ex=clamp(ball.vx/200,-1,1)*2*k, ey=clamp(ball.vy/200,-1,1)*2*k;
      ctx.fillStyle='#14213a';
      ctx.beginPath();ctx.ellipse(bx-3.5*k+ex,by-1+ey,1.6*k,2.6*k,0,0,7);ctx.fill();
      ctx.beginPath();ctx.ellipse(bx+3.5*k+ex,by-1+ey,1.6*k,2.6*k,0,0,7);ctx.fill();
    }
    ctx.restore();
    if(touch.on&&!sensor.ok){
      ctx.strokeStyle='rgba(244,241,230,.5)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(touch.ox,touch.oy,34,0,7);ctx.stroke();
      ctx.fillStyle='rgba(244,241,230,.6)';ctx.beginPath();ctx.arc(touch.ox+touch.x*34,touch.oy+touch.y*34,10,0,7);ctx.fill();
    }
  }

  function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale};}
  cv.addEventListener('pointerdown',e=>{
    if(!playing)return; e.preventDefault();
    if(sensor.ok){jump();return;}
    const p=pos(e);touch.on=true;touch.ox=p.x;touch.oy=p.y;touch.x=touch.y=0;touch.t=performance.now();touch.moved=0;
    try{cv.setPointerCapture(e.pointerId);}catch(_){}
  });
  cv.addEventListener('pointermove',e=>{if(!touch.on)return;const p=pos(e);let dx=(p.x-touch.ox)/34,dy=(p.y-touch.oy)/34;const d=Math.hypot(dx,dy);touch.moved=Math.max(touch.moved,d*34);if(d>1){dx/=d;dy/=d;}touch.x=dx;touch.y=dy;e.preventDefault();});
  cv.addEventListener('pointerup',()=>{if(touch.on&&performance.now()-touch.t<220&&touch.moved<10)jump();touch.on=false;touch.x=touch.y=0;});
  cv.addEventListener('pointercancel',()=>{touch.on=false;touch.x=touch.y=0;});
  window.addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')){keys[e.key]=true;e.preventDefault();}if(e.key===' '&&playing){jump();e.preventDefault();}});
  window.addEventListener('keyup',e=>{keys[e.key]=false;});
  document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

  let listening=false;
  async function go(){
    if(!listening){
      for(const E of [window.DeviceOrientationEvent,window.DeviceMotionEvent]){
        try{if(E&&typeof E.requestPermission==='function') await E.requestPermission();}catch(_){}
      }
      try{window.addEventListener('deviceorientation',onOrient);window.addEventListener('devicemotion',onMotion);}catch(_){}
      listening=true;
    }
    try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(()=>{});}catch(_){}
    if(action==='next') load(cur+1);
    else if(action==='restart'||action==='start'){totalStars=0;totalReds=0;load(0);}
    else load(cur);
    $('panel').hidden=true; playing=true;
  }
  $('pBtn').addEventListener('click',go);

  load(0); fit();
  window.addEventListener('resize',fit);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
  requestAnimationFrame(frame);
})();
</script>
